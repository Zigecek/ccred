# cargo-deny: supply chain policy.
#
# The strictest control here is [bans.build]: nothing in the dependency tree
# may execute code at build time unless it is named below. For a tool that
# holds OAuth tokens, "the artifact you audited is the artifact that runs" is
# worth the maintenance.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl-sys", reason = "no system OpenSSL coupling; there is no TLS here yet and if there ever is, it will be rustls" },
    { name = "openssl" },
    { name = "tokio", reason = "no async runtime in a CLI that runs twice a week" },
    { name = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
yanked = "deny"
