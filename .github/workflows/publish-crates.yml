name: publish-crates

# Called by the dist release workflow as a custom publish job.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-24.04
    permissions:
      # OIDC: exchanged for a crates.io token that lives 30 minutes and is
      # revoked in a post step. No long-lived secret exists to leak.
      id-token: write
      contents: read
    # A second pair of eyes on anything that ships a credential tool.
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
