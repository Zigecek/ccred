name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the workflow level; nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The scheduler backends render on every host, so the macOS artifacts are
      # checked here even though the install path itself is not exercised.
      - run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # A credential tool has no business printing a secret, so the rule is
  # enforced structurally rather than trusted: `.expose()` is the only route to
  # a raw token, and it may only appear where handling one is the job.
  secret_discipline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: expose() stays confined
        run: |
          # Exactly the two files that legitimately see raw bytes. The
          # allowlist used to include all of src/store/, which no longer
          # needs it -- a narrower list catches more.
          allowed='^src/(redact|validate)\.rs$'
          offenders=$(grep -rln '\.expose()' src | grep -Ev "$allowed" || true)
          if [ -n "$offenders" ]; then
            echo "::error::.expose() used outside the modules allowed to see raw tokens:"
            echo "$offenders"
            exit 1
          fi
      - name: no Display impl on Secret
        run: |
          if grep -n 'impl .*Display for Secret' src/redact.rs; then
            echo "::error::Secret must not implement Display -- that turns a compile error into a runtime leak"
            exit 1
          fi
