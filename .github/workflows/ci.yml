name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the workflow level; nothing here needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The scheduler backends render on every host, so the macOS artifacts are
      # checked here even though the install path itself is not exercised.
      - run: cargo test --workspace --all-features

  # The one platform where a schedule can be registered on a disposable
  # machine. Everything else about the systemd backend is unit-tested against
  # rendered text; this asks systemd itself what it made of it.
  #
  # Deliberately not part of `cargo test`: the suite must never touch the
  # scheduler of the machine it runs on. A runner is thrown away afterwards.
  systemd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-features --locked
      - name: Register a timer, read it back, remove it
        run: |
          set -euo pipefail
          export CCRED_NO_AUTO_SCHEDULE=1
          home="$(mktemp -d)"
          conf="$(mktemp -d)"
          bin="target/debug/ccred"
          run() { "$bin" --ccred-home "$home" --claude-config-dir "$conf" "$@"; }

          # A container without a user bus is a supported answer, not a
          # failure: it must be exit 8 with a reason, never a crash or a hang.
          set +e
          out="$(run schedule install --json 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" = "8" ]; then
            echo "no user manager here; ccred said so and stopped"
            exit 0
          fi
          test "$code" = "0"
          echo "$out" | jq -e '.next_run != null' >/dev/null

          # systemd's own view of what was written.
          systemctl --user list-timers --all | grep -q ccred
          systemctl --user cat ccred-refresh.timer >/dev/null
          test "$(systemctl --user is-enabled ccred-refresh.timer)" = "enabled"

          run schedule status --json | jq -e '.state == "installed"' >/dev/null
          run schedule status --json | jq -e '.enabled == true' >/dev/null
          run schedule uninstall
          ! systemctl --user list-timers --all | grep -q ccred
          test -z "$(ls -A "$HOME/.config/systemd/user" 2>/dev/null | grep ccred || true)"
          echo "registered, read back and removed"

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --workspace --all-features --locked

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # A credential tool has no business printing a secret, so the rule is
  # enforced structurally rather than trusted: `.expose()` is the only route to
  # a raw token, and it may only appear where handling one is the job.
  secret_discipline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: expose() stays confined
        run: |
          # Exactly the two files that legitimately see raw bytes. The
          # allowlist used to include all of src/store/, which no longer
          # needs it -- a narrower list catches more.
          allowed='^src/(redact|validate)\.rs$'
          offenders=$(grep -rln '\.expose()' src | grep -Ev "$allowed" || true)
          if [ -n "$offenders" ]; then
            echo "::error::.expose() used outside the modules allowed to see raw tokens:"
            echo "$offenders"
            exit 1
          fi
      - name: no Display impl on Secret
        run: |
          if grep -n 'impl .*Display for Secret' src/redact.rs; then
            echo "::error::Secret must not implement Display -- that turns a compile error into a runtime leak"
            exit 1
          fi

      # A panic in a scheduled run is a slot that reports nothing and a
      # profile that quietly goes stale. The script says what it found.
      - name: no panic site outside tests
        run: sh scripts/no-panics.sh
