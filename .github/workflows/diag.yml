name: diag

# Temporary. The release job reports Contents: write and still gets 403 from
# `gh release create`, while a raw POST to the same endpoint with the same
# token returns 201. This mirrors the release job exactly -- checkout
# included, since the previous attempt failed for the unrelated reason of not
# being in a git repository -- to find the actual difference.

on:
  workflow_dispatch:
  # The release workflow is triggered by a tag push and fails; this one is
  # triggered by dispatch and succeeds. Testing whether the event is the
  # difference.
  push:
    tags: ["diag-*"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: gh release create, exactly as the release job calls it
        run: |
          set +e
          echo "diag notes" > notes.txt
          gh release create diag-probe             --target "${{ github.sha }}"             --title "diag"             --notes-file notes.txt
          echo "GH_EXIT=$?"
          gh release delete diag-probe --yes --cleanup-tag 2>/dev/null

      - name: the same request through the raw API
        run: |
          set +e
          code=$(curl -sS -o /tmp/b.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/${{ github.repository }}/releases             -d "{\"tag_name\":\"diag-probe-api\",\"target_commitish\":\"${{ github.sha }}\",\"name\":\"diag\",\"body\":\"diag\"}")
          echo "CURL_HTTP=$code"
          head -c 300 /tmp/b.json
          if [ "$code" = "201" ]; then
            id=$(jq -r .id /tmp/b.json)
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN"               "https://api.github.com/repos/${{ github.repository }}/releases/$id"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN"               "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/diag-probe-api"
          fi
