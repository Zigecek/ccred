name: diag

# Temporary. Answers one question: can GITHUB_TOKEN create a release here?
# The release job reports Contents: write and still gets a 403, which should
# not be possible, so this reproduces it in isolation with the API response
# visible instead of swallowed by the gh CLI.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: What does the token think it can do
        run: |
          echo "--- token scopes as reported by the API ---"
          curl -sS -D - -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }} \
            | grep -iE "^x-(oauth|accepted|ratelimit-resource)" || true

      # Isolates the one remaining difference: the release job uses the gh
      # CLI, this previously used curl. Same endpoint, same token.
      - name: Try it through the gh CLI, the way the release job does
        run: |
          set +e
          gh release create diag-gh-probe --draft --notes "diag" --title diag
          echo "gh exit: $?"
          gh release delete diag-gh-probe --yes 2>/dev/null
          echo "--- which token does gh think it is using ---"
          gh auth status 2>&1 | sed 's/gho_[A-Za-z0-9]*/<redacted>/'

      - name: Try creating a draft release, showing the full response
        run: |
          set +e
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases \
            -d '{"tag_name":"diag-probe","draft":true,"name":"diag"}')
          echo "HTTP $code"
          cat /tmp/body.json
          if [ "$code" = "201" ]; then
            id=$(jq -r .id /tmp/body.json)
            echo "cleaning up draft $id"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$id"
          fi
