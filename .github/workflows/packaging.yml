name: packaging

# Downstream packaging, after a release exists.
#
# The .deb is attached to the same release; the AUR step pushes to another
# repository, so it is safe to run afterwards.
#
# Scoop is not here. Pushing to Zigecek/scoop-ccred from this repository would
# need a long-lived personal token, so the bucket updates itself: a scheduled
# workflow there moves the manifest to the latest release after checking the
# archive's checksum. It once sat on 0.2.0 for fourteen releases because
# nothing ran the manifest's `autoupdate` at all.
#
# NOTE: if repository-level immutable releases are ever enabled, attaching the
# .deb here will start failing, because assets cannot be added to a published
# release. Move the deb job into dist's global-artifacts stage at that point.
#
# TRIGGERS: `release: published` never actually fires for our releases. dist
# creates them with GITHUB_TOKEN, and GitHub deliberately does not start a new
# workflow run from an event raised by that token -- so this workflow sat
# unrun through every release. `workflow_run` is the supported way to chain
# after another workflow and is not subject to that rule; the release trigger
# is kept only for a release published by a human.
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package
        required: true

permissions:
  contents: write

env:
  NFPM_VERSION: "2.47.0"

jobs:
  # Each trigger names the tag somewhere different, so resolve it once and let
  # every job read the same answer.
  resolve:
    runs-on: ubuntu-24.04
    # Deliberately NOT gated on the Release run's overall conclusion. That run
    # also carries the registry publish jobs, which fail for as long as the
    # accounts are unconfigured -- and a release whose artifacts all built and
    # published is worth packaging regardless. What matters is whether the
    # release actually exists, which the next job checks directly.
    #
    # It IS gated on the Release run having come from a tag. The release
    # workflow also runs on pull requests, to check that its own plan still
    # builds, and packaging then started on a branch name with no release
    # behind it and failed -- a red run on every pull request, which the
    # first one this repository ever had duly produced.
    if: >-
      ${{ github.event_name != 'workflow_run'
          || (github.event.workflow_run.conclusion != 'cancelled'
              && github.event.workflow_run.event == 'push'
              && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) tag='${{ github.event.inputs.tag }}' ;;
            release)           tag='${{ github.event.release.tag_name }}' ;;
            workflow_run)      tag='${{ github.event.workflow_run.head_branch }}' ;;
            *)                 tag='${{ github.ref_name }}' ;;
          esac
          # A Release run on a branch rather than a tag has nothing to package.
          case "$tag" in
            v*) ;;
            *) echo "::error::'$tag' is not a release tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The release is what we package from, so its absence is the real gate.
      - name: Require the release to exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ steps.pick.outputs.tag }}"                  --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::error::no release for ${{ steps.pick.outputs.tag }}"
            exit 1
          fi

  deb:
    needs: resolve
    runs-on: ubuntu-24.04
    # The job-level grant replaces the workflow's, so `contents` is repeated.
    # The other two are what signing the package needs: an OIDC token to prove
    # which workflow built it, and the right to record the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Carry the tag into the environment
        run: echo "TAG=${{ needs.resolve.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Fetch nfpm and verify it
        run: |
          set -euo pipefail
          base="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}"
          archive="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          # Keep the published filename: `sha256sum -c` looks the name up on
          # disk, so downloading to nfpm.tar.gz made verification check a file
          # that was never there -- and still exit 0 on the grep.
          curl -sSLo "$archive" "${base}/${archive}"
          curl -sSLo checksums.txt "${base}/checksums.txt"
          # Verifying the download beats trusting a third-party action with the
          # release pipeline of a credential tool. Anchor the match: the plain
          # substring also selects the .sbom.json line.
          grep -E "  ${archive}\$" checksums.txt | sha256sum -c -
          tar xzf "$archive" nfpm
          chmod +x nfpm

      - name: Fetch the binary from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --pattern "ccred-${{ matrix.target }}.tar.xz" --output - \
            | tar xJ -C dist --strip-components=1
          test -f dist/ccred

      - name: Build the package
        env:
          CCRED_DEB_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export CCRED_VERSION="${TAG#v}"
          ./nfpm pkg --packager deb --config packaging/nfpm.yaml --target dist/

      # The package is installed as root by people who will not read it
      # first, so it is installed here, on the architecture the runner can
      # actually run, and asked to do something before it is published.
      # `dpkg -c` alone would not have caught a binary that cannot start.
      - name: Install it and use it
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/ccred_*_amd64.deb
          test "$(ccred --version)" = "ccred ${TAG#v}"
          # Static on purpose: built against musl, so the package declares no
          # dependency on a libc. ldd words that two ways depending on whether
          # the binary is position independent.
          ldd "$(command -v ccred)" 2>&1 | grep -Eq "not a dynamic executable|statically linked"
          test -f /usr/share/doc/ccred/copyright
          export CCRED_NO_AUTO_SCHEDULE=1
          home="$(mktemp -d)"
          conf="$(mktemp -d)"
          # No login anywhere in sight: the answer is a report, not a crash.
          # What the commands say is the test suite's job, on this same
          # runner; this asks only whether the packaged binary runs at all.
          ccred --ccred-home "$home" --claude-config-dir "$conf" list --json | jq -e 'type == "array"'
          ccred --ccred-home "$home" --claude-config-dir "$conf" current --json | jq -e '.logged_in == false'
          sudo apt-get remove -y ccred

      # Everything dist builds carries a provenance attestation and a
      # checksum; the package built here is the one thing people install with
      # root, so it gets both too. `--clobber` would otherwise leave a stale
      # digest next to a rebuilt package, which is why the sum is written from
      # the file that is about to be uploaded rather than kept anywhere.
      - name: Attest the package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.deb

      - name: Write its checksum
        run: |
          set -euo pipefail
          cd dist
          for f in *.deb; do
            # `-b` and a bare name, so the file matches dist's own .sha256
            # files byte for byte in shape and `sha256sum -c` finds it.
            sha256sum -b "$f" > "$f.sha256"
          done

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.deb dist/*.deb.sha256 --clobber

  # cargo-dist prints the shell's name on the same line as the command that
  # puts ccred on PATH, and the first person to install this copied the line
  # whole -- parentheses and all -- and got an error. The generated scripts
  # cannot be edited in the repository, since dist rewrites them every
  # release, so the published ones are rewritten here.
  installers:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Make the PATH advice copy-pasteable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir installers             --pattern 'ccred-installer.sh' --pattern 'ccred-installer.ps1'
          python3 scripts/clarify-installer.py             installers/ccred-installer.sh installers/ccred-installer.ps1
          # Still a script after being edited.
          sh -n installers/ccred-installer.sh
          gh release upload "$TAG" --clobber             installers/ccred-installer.sh installers/ccred-installer.ps1

  aur:
    needs: [resolve, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      # Gate on the deploy key existing, so releases do not start failing
      # before the AUR account is set up. Only the boolean is exposed here,
      # never the key itself.
      - name: Check whether the AUR key is configured
        id: gate
        run: echo "ready=${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the PKGBUILD
        if: steps.gate.outputs.ready == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          v="${TAG#v}"
          sed -i "s/^pkgver=.*/pkgver=$v/;s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD

      - uses: KSXGitHub/github-actions-deploy-aur@2ac5a4c1d7035885d46b10e3193393be8460b6f1 # v4.1.1
        if: steps.gate.outputs.ready == 'true'
        with:
          pkgname: ccred-bin
          pkgbuild: packaging/aur/PKGBUILD
          updpkgsums: true
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          commit_message: "chore: bump to ${{ needs.resolve.outputs.tag }}"
